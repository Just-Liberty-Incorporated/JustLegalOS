[package]
name = "justlegal-os"
version = "0.1.0"
description = "JustLegal OS — Private, local-first legal document formatting and court assembly desktop client."
authors = ["Just Liberty Incorporated"]
edition = "2021"
default-run = "justlegalos"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "justlegal_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-fs",
    "dep:tauri-build"
]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
typst = "0.12"
typst-pdf = "0.12"
zip = "2.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1.8"
rand = "0.8"
base64 = "0.22"
walkdir = "2"
comemo = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
dirs = "5.0"
clap = { version = "=4.5.20", features = ["derive"] }
thiserror = "1.0"
regex = "1.11"
flate2 = "1"
lopdf = "0.34"

[[bin]]
name = "justlegalos"
path = "src/main.rs"

[[bin]]
name = "justlegalos-cli"
path = "src/bin/justlegalos/main.rs"


